<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拓竹耗材与打印机管理系统 / Filament Manager</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; color: #1f2937; padding: 20px; }
        .container { max-width: 1100px; margin: 20px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e5e7eb; padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { font-size: 22px; color: #111827; font-weight: 700; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #374151; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; }
        .btn-primary { background: #10b981; color: #ffffff; }
        .btn-secondary { background: #4b5563; color: #ffffff; }
        .btn-blue { background: #2563eb; color: #ffffff; }
        .btn-purple { background: #8b5cf6; color: #ffffff; }
        .btn-amber { background: #f59e0b; color: #ffffff; }
        .btn-danger { background: #ef4444; color: #ffffff; }
        .alert-msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; display: block; }
        .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-top: 20px; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
        th { background: #f3f4f6; font-weight: 600; }
        .color-badge { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; margin-right: 6px; border: 1px solid #ccc; }
        .code-box { background: #1e293b; color: #38bdf8; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; word-break: break-all; margin-top: 8px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #ffffff; width: 880px; max-width: 95%; max-height: 85vh;
            border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 12px; }
        .modal-body { overflow-y: auto; margin-top: 15px; flex: 1; }
        .close-btn { font-size: 24px; cursor: pointer; color: #6b7280; font-weight: bold; }
        .badge-used { color: #ef4444; font-weight: bold; }
        .badge-add { color: #10b981; font-weight: bold; }
        .task-name-box { font-family: monospace; font-size: 13px; color: #1e293b; word-break: break-all; }
        .price-tag { font-size: 12px; color: #6b7280; margin-left: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>拓竹耗材与打印机管理系统</h2>
    </div>

    <!-- 1. 登录注册模块 -->
    <div id="authSection">
        <div class="card">
            <h3 style="margin-bottom: 15px;">账号登录与注册</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn btn-primary" onclick="handleLogin()" style="flex: 1;">登录系统</button>
                <button class="btn btn-secondary" onclick="handleRegister()" style="flex: 1;">注册新账号</button>
            </div>
            <div id="authMsg" class="alert-msg"></div>
        </div>
    </div>

    <!-- 2. 主控制台 -->
    <div id="mainSection" class="hidden">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <span style="font-size: 16px; font-weight: 600;">当前登录账户：</span>
                <span id="currentUser" style="font-weight: bold; color: #2563eb;"></span>
            </div>
            <button class="btn btn-secondary" onclick="logout()" style="width: auto;">退出登录</button>
        </div>

        <div class="card">
            <h3>🔑 后处理脚本 API 密钥 (X-API-Key)</h3>
            <p style="font-size: 13px; color: #6b7280; margin-top: 4px;">复制生成的 API Key 填入 Windows 端的配置文件中，系统即可精准判断数据归属。</p>
            <div style="margin-top: 12px; display: flex; gap: 10px;">
                <button class="btn btn-blue" onclick="generateApiKey()">生成/重置我的脚本 API Key</button>
            </div>
            <div id="apiKeyDisplay" class="code-box hidden">尚未生成 API Key</div>
        </div>

        <div class="card">
            <h3>➕ 手动新增耗材档案</h3>
            <div class="form-row" style="margin-top: 12px;">
                <div class="form-group">
                    <label>品牌</label>
                    <input type="text" id="f_brand" value="Bambu Lab">
                </div>
                <div class="form-group">
                    <label>材质</label>
                    <input type="text" id="f_material" placeholder="如 PLA / PETG">
                </div>
                <div class="form-group">
                    <label>颜色名称与 HEX</label>
                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="f_color_name" placeholder="如 哑光黑">
                        <input type="color" id="f_color_hex" value="#000000" style="width: 50px; padding: 2px;">
                    </div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>初始重量 (克/g)</label>
                    <input type="number" id="f_weight" value="1000">
                </div>
                <div class="form-group">
                    <label>购买总价 (元)</label>
                    <input type="number" id="f_price" value="99">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="addFilament()" style="width: 100%;">保存耗材档案</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3>我的耗材台账</h3>
                <button class="btn btn-blue" onclick="loadFilaments()" style="width: auto; padding: 6px 12px; font-size: 13px;">刷新列表</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>品牌</th>
                        <th>材质</th>
                        <th>颜色</th>
                        <th>剩余重量 / 价值</th>
                        <th>买入原价</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="filamentTableBody">
                    <tr><td colspan="7" style="text-align: center; color: #9ca3af;">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 弹窗 1：主列表【手动调整】弹窗 -->
<div id="adjustModal" class="modal-overlay hidden">
    <div class="modal-content" style="width: 500px;">
        <div class="modal-header">
            <h3>⚙️ 手动调整耗材存量</h3>
            <span class="close-btn" onclick="closeAdjustModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="adj_filament_id">
            <div class="form-group">
                <label>调整类型</label>
                <select id="adj_type" onchange="calculateAdjPriceNotice('adj')">
                    <option value="reduce">减少 (-)</option>
                    <option value="add">增加 (+)</option>
                </select>
            </div>
            <div class="form-group">
                <label>调整数值 (克/g)</label>
                <input type="number" id="adj_weight" placeholder="请输入数值 (例如: 50)" oninput="calculateAdjPriceNotice('adj')">
            </div>
            <div class="form-group">
                <label>模型名称 / 备注说明</label>
                <input type="text" id="adj_reason" placeholder="例: 手动补充库存、炒面损耗、模型名称">
            </div>
            <div id="adj_price_notice" style="font-size: 13px; color: #d97706; font-weight: bold; margin-bottom: 12px;"></div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-amber" style="flex: 1;" onclick="submitAdjustModal()">确认提交并重算价格</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeAdjustModal()">取消</button>
            </div>
        </div>
    </div>
</div>

<!-- 弹窗 2：【查看明细】弹窗 -->
<div id="logModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📜 耗材历史使用与损耗账单</h3>
            <span class="close-btn" onclick="closeLogs()">&times;</span>
        </div>
        <div class="modal-body">
            <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <input type="hidden" id="modal_filament_id">
                    <select id="modal_adj_type" style="width: 110px; padding: 6px; font-size: 13px;" onchange="calculateAdjPriceNotice('modal')">
                        <option value="reduce">减少 (-)</option>
                        <option value="add">增加 (+)</option>
                    </select>
                    <input type="number" id="quick_adj_weight" placeholder="克重 (g)" style="width: 120px; padding: 6px 10px; font-size: 13px;" oninput="calculateAdjPriceNotice('modal')">
                    <input type="text" id="quick_adj_reason" placeholder="模型名称 / 备注说明" style="flex: 1; padding: 6px 10px; font-size: 13px;">
                    <button class="btn btn-amber" style="padding: 6px 14px; font-size: 13px; white-space: nowrap;" onclick="submitModalQuickAdjust()">提交调整</button>
                </div>
                <div id="modal_adj_price_notice" style="font-size: 12px; color: #d97706; font-weight: bold; margin-top: 6px; margin-left: 2px;"></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>模型 / 备注说明</th>
                        <th>变动重量</th>
                        <th>损耗/补充金额</th>
                        <th>变动后剩余存量 (价值)</th>
                        <th style="width: 80px;">操作</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <tr><td colspan="6" style="text-align: center; color: #9ca3af;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const BASE_URL = window.location.origin;
    let globalFilamentsMap = {};

    function showMsg(text, isError = false) {
        const msgDiv = document.getElementById('authMsg');
        msgDiv.innerText = typeof text === 'string' ? text : (text.detail || JSON.stringify(text));
        msgDiv.className = isError ? 'alert-msg alert-error' : 'alert-msg alert-success';
    }

    async function handleRegister() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (!u || !p) return showMsg("请输入用户名和密码", true);

        try {
            const res = await fetch(`${BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            showMsg(res.ok ? "注册成功，请点击【登录系统】" : (data.detail || "注册失败"), !res.ok);
        } catch (e) {
            showMsg("网络错误，请检查服务器连接", true);
        }
    }

    async function handleLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if (!u || !p) return showMsg("请输入用户名和密码", true);

        const formData = new URLSearchParams();
        formData.append('username', u);
        formData.append('password', p);

        try {
            const res = await fetch(`${BASE_URL}/api/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formData
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('username', u);
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                document.getElementById('currentUser').innerText = u;
                loadFilaments();
            } else {
                showMsg(data.detail || "账号或密码错误", true);
            }
        } catch (e) {
            showMsg("登录失败，请重试", true);
        }
    }

    async function generateApiKey() {
        const token = localStorage.getItem('token');
        const res = await fetch(`${BASE_URL}/api/auth/api-keys`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
            body: JSON.stringify({key_name: "Windows后处理脚本"})
        });
        if (res.ok) {
            const data = await res.json();
            const box = document.getElementById('apiKeyDisplay');
            box.innerText = "你的 API Key: " + data.api_key;
            box.classList.remove('hidden');
        }
    }

    async function addFilament() {
        const token = localStorage.getItem('token');
        const payload = {
            brand: document.getElementById('f_brand').value,
            material: document.getElementById('f_material').value,
            color_name: document.getElementById('f_color_name').value,
            color_hex: document.getElementById('f_color_hex').value,
            initial_weight_g: parseFloat(document.getElementById('f_weight').value),
            current_weight_g: parseFloat(document.getElementById('f_weight').value),
            price: parseFloat(document.getElementById('f_price').value)
        };
        if(!payload.material || !payload.color_name) return alert("请填写材质和颜色名称");

        const res = await fetch(`${BASE_URL}/api/filaments`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            alert("新增耗材成功！");
            loadFilaments();
        }
    }

    async function loadFilaments() {
        const token = localStorage.getItem('token');
        if (!token) return;

        const res = await fetch(`${BASE_URL}/api/filaments?_t=${Date.now()}`, {
            headers: {'Authorization': 'Bearer ' + token, 'Cache-Control': 'no-cache'}
        });
        if (res.ok) {
            const list = await res.json();
            const tbody = document.getElementById('filamentTableBody');
            
            globalFilamentsMap = {};
            list.forEach(item => { globalFilamentsMap[item.id] = item; });

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #9ca3af;">暂无耗材数据</td></tr>`;
                return;
            }

            const rowsHtml = list.map(item => {
                const unitPricePerG = (item.price / (item.initial_weight_g || 1000));
                const currentRemainingValue = (item.current_weight_g * unitPricePerG).toFixed(2);

                return `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td>${item.brand}</td>
                        <td>${item.material}</td>
                        <td><span class="color-badge" style="background-color: ${item.color_hex};"></span>${item.color_name}</td>
                        <td>
                            <strong style="color: #10b981;">${item.current_weight_g} g</strong>
                            <span class="price-tag">(约 ¥${currentRemainingValue})</span>
                        </td>
                        <td>¥ ${item.price}</td>
                        <td>
                            <button class="btn btn-purple" style="margin-right: 4px;" onclick="showLogs(${item.id})">查看明细</button>
                            <button class="btn btn-amber" style="margin-right: 4px;" onclick="openAdjustModal(${item.id})">手动调整</button>
                            <button class="btn btn-danger" onclick="deleteFilament(${item.id})">删除档案</button>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = rowsHtml;
        }
    }

    function calculateAdjPriceNotice(source) {
        const isModal = source === 'modal';
        const fid = document.getElementById(isModal ? 'modal_filament_id' : 'adj_filament_id').value;
        const adjType = document.getElementById(isModal ? 'modal_adj_type' : 'adj_type').value;
        const weightInput = parseFloat(document.getElementById(isModal ? 'quick_adj_weight' : 'adj_weight').value);
        const noticeDiv = document.getElementById(isModal ? 'modal_adj_price_notice' : 'adj_price_notice');

        if (!fid || !globalFilamentsMap[fid] || isNaN(weightInput) || weightInput <= 0) {
            noticeDiv.innerText = '';
            return;
        }

        const filament = globalFilamentsMap[fid];
        const unitPricePerG = (filament.price / (filament.initial_weight_g || 1000));
        const cost = (weightInput * unitPricePerG).toFixed(2);

        if (adjType === 'reduce') {
            noticeDiv.innerText = `💡 提示：本次扣减 ${weightInput}g，预计折算消耗金额：¥ ${cost} 元`;
        } else {
            noticeDiv.innerText = `💡 提示：本次补充 ${weightInput}g，预计折算增加存量价值：¥ ${cost} 元`;
        }
    }

    function openAdjustModal(filamentId) {
        document.getElementById('adj_filament_id').value = filamentId;
        document.getElementById('adj_weight').value = '';
        document.getElementById('adj_reason').value = '';
        document.getElementById('adj_type').value = 'reduce';
        document.getElementById('adj_price_notice').innerText = '';
        document.getElementById('adjustModal').classList.remove('hidden');
    }

    function closeAdjustModal() {
        document.getElementById('adjustModal').classList.add('hidden');
    }

    async function submitAdjustModal() {
        const fid = document.getElementById('adj_filament_id').value;
        const adjType = document.getElementById('adj_type').value;
        const w = parseFloat(document.getElementById('adj_weight').value);
        const reason = document.getElementById('adj_reason').value.trim() || "手动调整";

        if (isNaN(w) || w <= 0) return alert("请输入有效的克重数值");

        const actualWeightChange = adjType === 'reduce' ? w : -w;
        const token = localStorage.getItem('token');

        const res = await fetch(`${BASE_URL}/api/filaments/${fid}/adjust-weight`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
            body: JSON.stringify({adjust_weight_g: actualWeightChange, reason: reason})
        });

        if (res.ok) {
            closeAdjustModal();
            loadFilaments();
        } else {
            alert("调整失败，请刷新后重试");
        }
    }

    async function showLogs(filamentId) {
        document.getElementById('modal_filament_id').value = filamentId;
        document.getElementById('quick_adj_weight').value = '';
        document.getElementById('quick_adj_reason').value = '';
        document.getElementById('modal_adj_type').value = 'reduce';
        document.getElementById('modal_adj_price_notice').innerText = '';
        document.getElementById('logModal').classList.remove('hidden');
        await refreshModalLogs(filamentId);
    }

    async function refreshModalLogs(filamentId) {
        const token = localStorage.getItem('token');
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#9ca3af;">加载中...</td></tr>';

        const filament = globalFilamentsMap[filamentId];
        const unitPricePerG = filament ? (filament.price / (filament.initial_weight_g || 1000)) : 0;

        const res = await fetch(`${BASE_URL}/api/filaments/${filamentId}/logs?_t=${Date.now()}`, {
            headers: {'Authorization': 'Bearer ' + token, 'Cache-Control': 'no-cache'}
        });

        if (res.ok) {
            const logs = await res.json();
            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#9ca3af;">暂无使用扣减记录</td></tr>`;
                return;
            }
            tbody.innerHTML = logs.map(log => {
                const absWeight = Math.abs(log.used_weight_g);
                const costMoney = (absWeight * unitPricePerG).toFixed(2);
                const remMoney = log.remaining_weight_g !== null ? (log.remaining_weight_g * unitPricePerG).toFixed(2) : '-';

                return `
                    <tr>
                        <td style="font-size: 12px; color: #64748b;">${log.created_at}</td>
                        <td class="task-name-box">${log.task_name || '手动调整/导出'}</td>
                        <td class="${log.used_weight_g > 0 ? 'badge-used' : 'badge-add'}">${log.used_weight_g > 0 ? '-' + log.used_weight_g : '+' + absWeight} g</td>
                        <td style="font-weight: bold; color: ${log.used_weight_g > 0 ? '#ef4444' : '#10b981'};">
                            ${log.used_weight_g > 0 ? '- ¥' + costMoney : '+ ¥' + costMoney}
                        </td>
                        <td><strong>${log.remaining_weight_g !== null ? log.remaining_weight_g + ' g (¥' + remMoney + ')' : '-'}</strong></td>
                        <td>
                            <button class="btn btn-danger" style="padding: 3px 8px; font-size: 11px;" onclick="deleteLogRecord(${log.id}, ${log.used_weight_g})">撤销/删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
    }

    async function submitModalQuickAdjust() {
        const fid = document.getElementById('modal_filament_id').value;
        const adjType = document.getElementById('modal_adj_type').value;
        const w = parseFloat(document.getElementById('quick_adj_weight').value);
        const reason = document.getElementById('quick_adj_reason').value.trim() || "手动调整";

        if (isNaN(w) || w <= 0) return alert("请输入有效的克重数值");

        const actualWeightChange = adjType === 'reduce' ? w : -w;
        const token = localStorage.getItem('token');

        const res = await fetch(`${BASE_URL}/api/filaments/${fid}/adjust-weight`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
            body: JSON.stringify({adjust_weight_g: actualWeightChange, reason: reason})
        });

        if (res.ok) {
            document.getElementById('quick_adj_weight').value = '';
            document.getElementById('quick_adj_reason').value = '';
            document.getElementById('modal_adj_price_notice').innerText = '';
            await loadFilaments();
            await refreshModalLogs(fid);
        }
    }

    async function deleteLogRecord(recordId, usedWeight) {
        const defaultRefund = usedWeight;
        
        let tipText = "";
        if (usedWeight > 0) {
            tipText = `该记录原本【减少了 ${usedWeight}g】\n• 确认输入 ${usedWeight} 将【退还并增加 ${usedWeight}g】存量\n• 输入 0 仅删除记录不改变重量`;
        } else {
            tipText = `该记录原本【增加了 ${Math.abs(usedWeight)}g】\n• 确认输入 ${usedWeight} 将【扣除并减少 ${Math.abs(usedWeight)}g】存量\n• 输入 0 仅删除记录不改变重量`;
        }

        const inputVal = prompt(
            `确定要撤销/删除此条记录吗？\n\n${tipText}`, 
            defaultRefund
        );

        if (inputVal === null) return;

        const refundWeight = parseFloat(inputVal);
        if (isNaN(refundWeight)) return alert("请输入有效的数字！");

        const token = localStorage.getItem('token');
        const fid = document.getElementById('modal_filament_id').value;

        const res = await fetch(`${BASE_URL}/api/usage-records/${recordId}?refund_weight_g=${refundWeight}`, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + token}
        });

        if (res.ok) {
            await loadFilaments();
            await refreshModalLogs(fid);
        } else {
            alert("撤销失败，请检查网络");
        }
    }

    function closeLogs() {
        document.getElementById('logModal').classList.add('hidden');
    }

    async function deleteFilament(id) {
        if(!confirm("确定删除该耗材档案吗？")) return;
        const token = localStorage.getItem('token');
        await fetch(`${BASE_URL}/api/filaments/${id}`, {
            method: 'DELETE',
            headers: {'Authorization': 'Bearer ' + token}
        });
        loadFilaments();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        document.getElementById('mainSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
    }

    window.onload = function() {
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('username');
        if (token && user) {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('currentUser').innerText = user;
            loadFilaments();
        }
    }
</script>
</body>
</html>
